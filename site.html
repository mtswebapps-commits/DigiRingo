<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIGIRINGO — A second phone number for a borderless world</title>
    <meta
      name="description"
      content="DIGIRINGO gives you real local phone numbers in 8+ countries. Call, text and manage everything from one beautifully simple app — no SIM, no contract."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking web fonts: the page paints with the system font, then swaps. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong theme.
      // Default is LIGHT.
      try {
        var t = localStorage.getItem("dg-theme");
        document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <!-- Google tag (GA4 G-851Y7T5D21 + Google Ads AW-18520064773). Production host
         only, so local dev and the native app's WebView never report. -->
    <script>
      if (location.hostname === "digiringo.com" || location.hostname === "www.digiringo.com") {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-851Y7T5D21");
        gtag("config", "AW-18520064773", { allow_enhanced_conversions: true });
        var s = document.createElement("script");
        s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=G-851Y7T5D21";
        document.head.appendChild(s);
      }
    </script>
    <style>
      html, body { margin: 0; background: #ffffff; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #05070d; }
      #root { min-height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/site.tsx"></script>
  </body>
</html>
