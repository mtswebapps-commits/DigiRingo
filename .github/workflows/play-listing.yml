name: Update Play store listing

# Manual-only. Rewrites the store listing's title and descriptions with
# scripts/play-listing.py. Leave "apply" unticked to see the change without saving it.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Save the change on Play (unticked = only show it)"
        type: boolean
        default: false

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API client
        run: pip install --quiet google-api-python-client google-auth

      - name: Update listing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: com.digiringo.app
          APPLY: ${{ inputs.apply }}
        run: python scripts/play-listing.py
