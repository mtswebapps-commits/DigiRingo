name: Deploy web to digiringo.com

# Builds the production web bundle in the cloud and ships it to the OVH VPS
# (148.113.182.43, where DIGIRINGO now runs as the `digiringo` systemd service
# behind nginx). Unlike Hostinger, OVH allows shell sessions from datacenter IPs,
# so this uses a plain rsync + `systemctl restart` — no lftp/SFTP throttle dance.
#
# One-time setup: repo secret `VPS_SSH_KEY` = the private half of the CI deploy
# key authorized on the VPS (root). Every push to main auto-deploys; you can also
# trigger it manually from the Actions tab ("Run workflow").

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "server/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.*"
      - ".env.production"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Never let two deploys overlap.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  VPS_HOST: 148.113.182.43
  VPS_USER: root
  APP_DIR: /opt/digiringo

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets (production / live)
        run: pnpm build

      - name: Set up SSH deploy key
        run: |
          mkdir -p ~/.ssh
          # `tr -d '\r'` repairs a key pasted from a Windows editor (CRLF would
          # otherwise corrupt it and SSH auth fails).
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY is not a valid private key — re-copy the ENTIRE key incl. BEGIN/END lines."
            exit 1
          fi
          ssh-keyscan -p 22 "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS (rsync dist/ + server/, restart service)
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25"
          # Replace the built front-end and the server code. --delete keeps the
          # targets clean; we ONLY sync these two subdirs so /opt/digiringo/.env,
          # node_modules and package.json (runtime state on the box) are untouched.
          rsync -az --delete -e "$SSH" dist/   "$VPS_USER@$VPS_HOST:$APP_DIR/dist/"
          rsync -az --delete -e "$SSH" server/ "$VPS_USER@$VPS_HOST:$APP_DIR/server/"
          # The server is otherwise zero-dependency; make sure its only two runtime
          # deps are present, then restart under systemd and confirm it came up.
          $SSH "$VPS_USER@$VPS_HOST" '
            cd '"$APP_DIR"' &&
            (node -e "require.resolve(\"mysql2\");require.resolve(\"nodemailer\")" 2>/dev/null || npm i --omit=dev --no-audit --no-fund mysql2 nodemailer) &&
            systemctl restart digiringo &&
            sleep 3 &&
            test "$(systemctl is-active digiringo)" = active &&
            echo "✓ digiringo active"'

      - name: Verify
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://digiringo.com/app || echo "000")
          echo "digiringo.com/app → $code"
          # Assert the LIVE bundle is the one we just built — a stale hash means the
          # upload silently didn't land.
          want=$(grep -oE 'main-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          live=$(curl -s "https://digiringo.com/app?cb=$(date +%s)" | grep -oE 'main-[A-Za-z0-9_-]+\.js' | head -1)
          echo "built: $want"
          echo "live : $live"
          if [ -z "$live" ] || [ "$want" != "$live" ]; then
            echo "::error::live bundle ($live) does not match the build ($want) — deploy did not land"
            exit 1
          fi
          echo "✓ live bundle matches the build"
